[package]
name = "tca6408a-wokwi-chip"
description = "Wokwi custom chip wrapping the tca6408a-sim behavioral model"
version = "0.1.0"
license = "EUPL-1.2 OR MIT OR Apache-2.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
tca6408a-sim = { path = "../../tca6408a-sim" }
tca6408a-registers = { path = "../../tca6408a-registers" }
wokwi_chip_ll = "0.2.0"

[profile.release]
opt-level = "s"
lto = true

[lints.clippy]
# Modules live in `name.rs` plus `name/`, never in `name/mod.rs`.
mod_module_files = "deny"
