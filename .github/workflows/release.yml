---
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and attest release assets
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
      id-token: write # sign the provenance attestation
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package crates
        run: cargo package -p tca6408a-registers -p tca6408a
      - name: Build Wokwi chip
        run: |
          rustup target add wasm32-unknown-unknown
          sim/wokwi-chip/build.sh
          # Wokwi's `github:` chip dependencies expect a chip.zip with chip.json and chip.wasm.
          mkdir -p dist/chip
          cp sim/wokwi-chip/tca6408a.chip.json dist/chip/chip.json
          cp sim/wokwi-chip/tca6408a.chip.wasm dist/chip/chip.wasm
          (cd dist/chip && zip -9 ../chip.zip chip.json chip.wasm)
          cp target/package/*.crate dist/
          ls -l dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/chip.zip
            dist/*.crate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            dist/chip.zip
            dist/*.crate
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    needs:
      - build
    runs-on: ubuntu-latest
    # The crates.io trusted publisher is bound to this environment.
    environment: crates-io
    permissions:
      contents: read # check out the repository
      id-token: write # exchange the OIDC token for a short-lived crates.io token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "tca6408a") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match crate version $version"
            exit 1
          fi
      - name: Find crates not yet on crates.io
        id: pending
        run: |
          version="${GITHUB_REF_NAME#v}"
          packages=""
          for crate in tca6408a-registers tca6408a; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -A "sunsided/tca6408a release workflow" \
              "https://crates.io/api/v1/crates/$crate/$version")
            if [ "$status" = "200" ]; then
              echo "$crate $version is already published, skipping"
            else
              packages="$packages -p $crate"
            fi
          done
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
      - name: Authenticate with crates.io
        if: steps.pending.outputs.packages != ''
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish
        if: steps.pending.outputs.packages != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          PACKAGES: ${{ steps.pending.outputs.packages }}
        # Publishes in dependency order: tca6408a-registers first, then tca6408a. Versions that are
        # already on crates.io (a manual first release, or a re-run) are skipped, and then no
        # crates.io token is requested.
        run: |
          # shellcheck disable=SC2086 # PACKAGES is a list of `-p <crate>` flags.
          cargo publish $PACKAGES

  github-release:
    name: Create GitHub Release
    needs:
      - build
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          .github/scripts/release-notes.sh "$version" tca6408a tca6408a-registers > release-notes.md
          cat release-notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$VERSION" --notes-file release-notes.md --verify-tag --repo "$GITHUB_REPOSITORY" dist/*
