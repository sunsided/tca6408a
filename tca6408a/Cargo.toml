[package]
name = "tca6408a"
description = "A platform-agnostic embedded-hal driver for the TI TCA6408A 8-bit I²C I/O expander"
categories = ["embedded", "hardware-support", "no-std"]
keywords = ["embedded-hal-driver", "tca6408a", "gpio", "io-expander", "i2c"]
readme = "README.md"
# The tests need the unpublished tca6408a-sim crate.
exclude = ["tests/"]
version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
async = ["dep:embedded-hal-async"]
defmt = ["dep:defmt", "tca6408a-registers/defmt"]

[dependencies]
tca6408a-registers.workspace = true
defmt = { workspace = true, optional = true }
embedded-hal.workspace = true
embedded-hal-async = { workspace = true, optional = true }

[dev-dependencies]
tca6408a-sim.workspace = true
embassy-futures.workspace = true
embedded-hal-async.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.release]
pre-release-replacements = [
    { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}\n\n[{{version}}]: https://github.com/sunsided/tca6408a/releases/tag/v{{version}}", exactly = 1 },
]
