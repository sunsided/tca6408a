# https://taskfile.dev
version: '3'

vars:
  EMBEDDED_TARGETS: thumbv7em-none-eabihf riscv32imc-unknown-none-elf
  # The no_std crates; tca6408a-sim is host-only test support.
  EMBEDDED_CRATES: -p tca6408a-registers -p tca6408a

tasks:
  default:
    cmds:
      - task --list --sort=none
    silent: true

  build:
    desc: Build the workspace for the host
    preconditions: &cargo
      - sh: command -v cargo
        msg: "cargo not found — install Rust from https://rustup.rs/"
    cmds:
      - cargo build --workspace --all-targets --all-features

  build:embedded:
    desc: Build the no_std crates for the embedded targets used in CI
    preconditions: *cargo
    cmds:
      - for: { var: EMBEDDED_TARGETS, split: ' ' }
        cmd: |
          rustup target list --installed | grep -qx {{.ITEM}} || rustup target add {{.ITEM}}
          cargo build {{.EMBEDDED_CRATES}} --all-features --target {{.ITEM}}

  test:
    desc: Run all tests with all features (pass extra args after --)
    preconditions: *cargo
    cmds:
      - cargo test --workspace --all-features {{.CLI_ARGS}}

  test:matrix:
    desc: Run all tests with default, all and no default features, as CI does
    preconditions: *cargo
    cmds:
      - cargo test --workspace
      - cargo test --workspace --all-features
      - cargo test --workspace --no-default-features

  coverage:
    desc: Measure test coverage and open the HTML report
    preconditions:
      - sh: command -v cargo-llvm-cov
        msg: "cargo-llvm-cov not found — cargo install cargo-llvm-cov (needs: rustup component add llvm-tools)"
    cmds:
      - cargo llvm-cov --workspace --all-features --open

  fmt:
    desc: Format all sources
    aliases: [format]
    preconditions: *cargo
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Check formatting without modifying files
    preconditions: *cargo
    cmds:
      - cargo fmt --all --check

  lint:
    desc: Run clippy with warnings as errors
    preconditions: *cargo
    cmds:
      - cargo clippy --workspace --all-targets --all-features -- -D warnings

  lint:fix:
    desc: Apply clippy fixes, then format
    aliases: [fix]
    preconditions: *cargo
    cmds:
      - cargo clippy --workspace --all-targets --all-features --fix --allow-dirty --allow-staged
      - task: fmt

  spell:
    desc: Check spelling
    preconditions:
      - sh: command -v codespell
        msg: "codespell not found — pipx install codespell"
    cmds:
      - codespell

  docs:
    desc: Build the documentation (warnings as errors)
    preconditions: *cargo
    env:
      RUSTDOCFLAGS: -D warnings
    cmds:
      - cargo doc --workspace --all-features --no-deps

  docs:open:
    desc: Build the documentation and open it in the browser
    preconditions: *cargo
    cmds:
      - cargo doc --workspace --all-features --no-deps --open

  check:
    desc: Run all static checks
    cmds:
      - task: fmt:check
      - task: lint
      - task: spell
      - task: docs

  ci:
    desc: Run the full CI sequence locally
    cmds:
      - task: check
      - task: test:matrix
      - task: build:embedded

  wokwi:chip:
    desc: Build the Wokwi custom chip (sim/wokwi-chip/tca6408a.chip.wasm)
    preconditions: *cargo
    dir: sim/wokwi-chip
    sources: [Cargo.toml, src/**/*.rs, ../../tca6408a-sim/src/**/*.rs, ../../tca6408a-registers/src/**/*.rs]
    generates: [tca6408a.chip.wasm]
    cmds:
      - ./build.sh

  wokwi:build:
    desc: Build the Wokwi chip and the ESP32-C3 example firmware
    preconditions: *cargo
    deps: [wokwi:chip]
    dir: examples/esp32c3
    cmds:
      - cargo build --release

  wokwi:lint:
    desc: Check formatting and run clippy on the Wokwi chip and the example firmware
    preconditions: *cargo
    cmds:
      - for: [sim/wokwi-chip, examples/esp32c3]
        cmd: cd {{.ITEM}} && cargo fmt --check && cargo clippy --release -- -D warnings

  wokwi:test:
    desc: Run the ESP32-C3 example against the Wokwi chip with the automation scenario
    deps: [wokwi:build]
    dir: examples/esp32c3
    preconditions:
      - sh: command -v wokwi-cli
        msg: "wokwi-cli not found — see https://docs.wokwi.com/wokwi-ci/cli-installation"
      - sh: test -n "$WOKWI_CLI_TOKEN"
        msg: "WOKWI_CLI_TOKEN not set — get a token at https://wokwi.com/dashboard/ci"
    cmds:
      - wokwi-cli . --scenario scenarios/buttons.yaml --timeout 30000

  release:dry-run:
    desc: Show what a release would do (LEVEL=patch|minor|major or an exact version)
    requires:
      vars: [LEVEL]
    preconditions: &cargo-release
      - sh: command -v cargo-release
        msg: "cargo-release not found — cargo install cargo-release"
    cmds:
      - cargo release {{.LEVEL}} --workspace

  release:
    desc: Bump, commit, tag and push vX.Y.Z; CI then publishes to crates.io and creates the GitHub Release
    requires:
      vars: [LEVEL]
    preconditions: *cargo-release
    prompt: "This pushes a release tag, which publishes the crates to crates.io. Continue?"
    cmds:
      - cargo release {{.LEVEL}} --workspace --execute

  clean:
    desc: Remove build artifacts
    preconditions: *cargo
    status:
      - test ! -d target
    cmds:
      - cargo clean
